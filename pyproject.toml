[project]
name = "jevoss"
version = "0.1.0"
description = "Open playground to test and improve Jev-type decision models: suites, calibration, consistency probes and recipes for any /v1/systemone endpoint."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Mert Kaya" }]
keywords = ["jev", "decision-model", "evaluation", "calibration", "benchmark", "llm", "typesafe", "system-one"]
dependencies = []

[project.optional-dependencies]
suites = ["datasets>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
jevoss = "jevoss.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevoss"]
